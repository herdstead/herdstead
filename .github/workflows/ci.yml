name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump both together; the checksum comes from the release's SHA512-SUMS.txt.
  GODOT_VERSION: 4.7.2-stable
  GODOT_LINUX_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  # The Makefile is the one place the commands live; CI has no .venv.
  PYTHON: python
  GODOT: godot

defaults:
  run:
    shell: bash

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci

      - name: Lint GDScript
        run: make lint

      - name: Docs name only files and make targets that exist
        # The entry docs; tools/check_docs.py lists them and says what counts.
        run: make docs-check

      - name: Rebuild every art pack and compare with the commit
        # PNGs compare by pixels: Pillow's zlib output differs across platforms.
        run: make art

      - name: Art contract tests
        run: make test-art

      - name: Import project
        run: |
          timeout 300 make import 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Developer command and shared harness contracts
        # Python contracts run once, not once per Godot shard.
        run: make test-tools test-harness

      - name: Every script and scene loads
        # Also the gate for project.godot's warnings-as-errors: a warning set to
        # Error makes the script fail to compile, and this is what loads them all.
        run: |
          timeout 120 make check-scripts 2>&1 | tee "$RUNNER_TEMP/scripts.log"
          if grep -E 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/scripts.log"; then exit 1; fi
          grep -q SCRIPTS_OK "$RUNNER_TEMP/scripts.log"

      - name: Run main scene once
        # No herdr on CI: the office starts OFFLINE and --quit exits after the
        # first frame. The target fails on any script error in the log.
        run: timeout 120 make smoke

      - name: Every art pack dresses the scenes
        # The semantic IDs the scenes draw with live in scripts/art/art_contract.gd;
        # this loads every pack in assets/ and checks it against them.
        run: |
          timeout 120 make check-packs 2>&1 | tee "$RUNNER_TEMP/packs.log"
          if grep -E 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/packs.log"; then exit 1; fi
          grep -q PACKS_OK "$RUNNER_TEMP/packs.log"

      - name: Export PCK and check its contents
        # --export-pack needs no export templates; it proves the preset ships the art pack.
        run: timeout 300 make pack

      - name: Screenshot the showroom and the live office
        # Capturing needs a viewport, so the software renderer gets a display.
        # A picture of what the PR changed, on every PR. No golden compare yet.
        # Only the key set (CAPTURE_SET=ci): the whole one takes over ten minutes.
        run: CAPTURE_SET=ci timeout 300 make capture OUT="$RUNNER_TEMP/captures"

      - name: Upload the screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: ${{ runner.temp }}/captures
          if-no-files-found: warn

  tests:
    name: Godot shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # A failed suite must not cancel coverage or logs from another shard.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci

      - name: Whole Godot suites in an isolated checkout
        # No shared .godot cache, in-process parallelism or exact-case filters.
        # The runner imports, checks loads and keeps every suite's full gates.
        run: make test-shard SHARD=${{ matrix.shard }}/${{ strategy.job-total }} 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Upload shard logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/tests.log
            build/test-results/
          if-no-files-found: warn

  # Keep the existing required status name. A skipped, cancelled or failed
  # dependency must fail this gate, not turn it into a successful skipped job.
  check:
    needs: [quality, tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate and shard to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "quality=$QUALITY tests=$TESTS"
          test "$QUALITY" = success
          test "$TESTS" = success
